[build-system]
requires = ["hatchling ~= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "memory_agent"
version = "0.1.0"
description = "Strands agent with Amazon Bedrock AgentCore Memory (short-term and long-term)"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro >= 0.21.0",
    "bedrock-agentcore[strands-agents] >= 1.18.1, < 2.0.0",
    "strands-agents >= 1.62.0, < 2.0.0",
    "strands-agents-tools >= 0.8.10, < 1.0.0",
    # mcp 2.0.x-2.1.x are affected by CVE-2026-59951 (fixed in 1.30.0 and 2.2.0)
    "mcp >= 1.30.0, != 2.0.*, != 2.1.*",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
