[build-system]
requires = ["hatchling ~= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "anthropic_agent"
version = "0.1.0"
description = "Strands agent using the Anthropic API, deployed on Amazon Bedrock AgentCore Runtime"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro >= 0.21.0",
    "bedrock-agentcore >= 1.18.1, < 2.0.0",
    "strands-agents[anthropic] >= 1.62.0, < 2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
