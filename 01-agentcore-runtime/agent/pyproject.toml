[build-system]
requires = ["hatchling ~= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "calculator"
version = "0.1.0"
description = "Calculator agent on Amazon Bedrock AgentCore Runtime, built with Strands Agents"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro >= 0.21.0",
    "bedrock-agentcore >= 1.18.1, < 2.0.0",
    "strands-agents >= 1.62.0, < 2.0.0",
    "strands-agents-tools >= 0.8.10, < 1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
